<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A question for you 💖</title>
<meta name="description" content="A little question, just for you.">
<meta property="og:type" content="website">
<meta property="og:title" content="A question for you 💖">
<meta property="og:description" content="Someone has a little question, just for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:var(--cfg-bg,#fff5f7);
  --primary:var(--cfg-primary,#e84a78);
  --accent:var(--cfg-accent,#ffc4d6);
  --card:#fffdf9;
  --text:#4a1d33;
  --muted:#8a5a6e;
  --on-primary:#fff;
  --glow:#ffe3a3;
  --shadow:0 18px 50px -18px rgba(232,74,120,.45),0 4px 14px rgba(74,29,51,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a1220;--card:#3a1a2c;--text:#ffeaf1;--muted:#e2b5c7;--glow:#ffd98a;
    --shadow:0 18px 50px -18px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a1220;--card:#3a1a2c;--text:#ffeaf1;--muted:#e2b5c7;--glow:#ffd98a;
  --shadow:0 18px 50px -18px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.0625rem;line-height:1.6;
  background-image:
    radial-gradient(60rem 40rem at 15% -10%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 60%),
    radial-gradient(50rem 36rem at 100% 110%,color-mix(in srgb,var(--glow) 45%,transparent),transparent 60%);
  background-attachment:fixed;
  overflow-x:hidden;
}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float{position:absolute;bottom:-12%;opacity:0;animation:rise linear infinite;will-change:transform}
@keyframes rise{
  0%{transform:translate3d(0,0,0) rotate(-8deg);opacity:0}
  12%{opacity:.75}
  100%{transform:translate3d(var(--dx,20px),-118vh,0) rotate(12deg);opacity:0}
}
main{
  position:relative;z-index:1;min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;padding:24px 16px;
}
.card{
  width:min(100%,34rem);background:var(--card);border-radius:36px;
  padding:clamp(28px,6vw,48px) clamp(22px,5vw,44px);text-align:center;
  box-shadow:var(--shadow);border:2px solid color-mix(in srgb,var(--accent) 60%,transparent);
  animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes pop{from{transform:translateY(28px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.heart-wrap{width:128px;height:128px;margin:0 auto 6px;position:relative}
.heart-wrap svg{width:100%;height:100%;overflow:visible}
.beat{transform-origin:50% 55%;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(.98)}42%{transform:scale(1.07)}70%{transform:scale(1)}}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.spark:nth-of-type(2){animation-delay:.8s}.spark:nth-of-type(3){animation-delay:1.5s}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}
.hello{margin:0;font-weight:800;color:var(--primary);font-size:1.1rem}
h1,h2{
  font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;
  line-height:1.12;letter-spacing:-.01em;margin:.2em 0 .45em;
  font-size:clamp(2rem,8vw,3rem);text-wrap:balance;
}
h1:focus,h2:focus{outline:none}
.msg{margin:0 auto 1.6rem;max-width:30rem;color:var(--muted);text-wrap:pretty}
.sign{font-family:"Fraunces",Georgia,serif;font-style:italic;color:var(--primary);margin:-.6rem 0 1.6rem}
.arena{position:relative;height:clamp(210px,38vh,250px);max-width:26rem;margin:0 auto}
.arena .yes{position:absolute;top:0;left:0;right:0;margin:0 auto;width:max-content}
.chip{background:#fffdf9;color:#4a1d33;border:2px solid var(--primary);font-size:.95rem;padding:.55em 1.1em;min-height:44px;margin:4px}
.chip:hover{background:var(--accent)}
.arena.calm{height:auto;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.arena.calm .yes,.arena.calm .no{position:static;margin:0;width:auto}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tools button,.tools select{font:inherit;font-size:.9rem;font-weight:600;min-height:44px;padding:.4em 1em;border-radius:999px;border:2px solid var(--accent);background:transparent;color:var(--text);cursor:pointer}
.tools select option{color:#4a1d33;background:#fffdf9}
.memory{margin:0 auto 1.2rem;max-width:28rem;text-align:left;color:var(--muted);font-size:.98rem}
.memory p{margin:.3rem 0}
:root[data-style="celebration"] .card{border:3px dotted var(--accent)}
:root[data-style="minimal"] .card{border-radius:22px;box-shadow:0 2px 18px rgba(0,0,0,.08)}
.card{background-image:linear-gradient(180deg,color-mix(in srgb,var(--accent) 24%,var(--card)),var(--card) 45%)}
.yes{background-image:linear-gradient(135deg,color-mix(in srgb,var(--primary) 78%,#fff),var(--primary))}
.music{position:fixed;z-index:20;top:calc(10px + env(safe-area-inset-top,0px));right:12px;min-height:44px;padding:.5em 1.1em;font-size:.92rem;background:var(--card);color:var(--text);border:2px solid var(--accent);box-shadow:var(--shadow)}
.music[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
@media (max-width:520px){
  main{padding:24px 14px 32px}
  .card{border-radius:30px;padding:26px 20px}
  .heart-wrap{width:104px;height:104px}
  .arena{max-width:none}
  .yes,.no,.sbtn{font-size:1.15rem;min-height:56px}
  .chip{width:100%;margin:4px 0}
  .msg{font-size:1.05rem}
}
button{
  font:inherit;font-weight:800;font-size:1.1rem;border:0;cursor:pointer;
  border-radius:999px;padding:.85em 1.8em;min-height:52px;
  transition:transform .2s,box-shadow .2s,left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1);
}
button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.yes{
  background:var(--primary);color:var(--on-primary);
  box-shadow:0 10px 24px -8px var(--primary);
  transform:scale(var(--yes-scale,1));
}
.yes:hover{box-shadow:0 14px 28px -8px var(--primary)}
.yes:active{transform:scale(calc(var(--yes-scale,1)*.95))}
.no{background:color-mix(in srgb,var(--accent) 55%,var(--card));color:var(--text)}
.no{position:absolute;left:0;top:0;margin:0;white-space:nowrap;touch-action:manipulation}
.hint{min-height:1.6em;margin:14px 0 0;color:var(--muted);font-size:.95rem}
.alt{
  display:inline-block;margin-top:6px;background:none;border:0;color:var(--muted);
  font-size:.9rem;font-weight:600;text-decoration:underline;min-height:44px;padding:.4em 1em;
}
.surprise{
  background:var(--glow);color:#4a1d33;border-radius:24px;padding:18px 20px;margin:18px auto 0;
  max-width:26rem;font-weight:600;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both;
}
.sbtn{background:var(--accent);color:#4a1d33;margin-top:4px}
[hidden]{display:none!important}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.piece{position:absolute;top:-8vh;animation:fall var(--t,3s) ease-in forwards}
@keyframes fall{
  to{transform:translate3d(var(--dx,0),112vh,0) rotate(var(--r,360deg));opacity:.9}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .float{opacity:.35;animation:none;bottom:auto}
  .confetti{display:none}
}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<main>
  <section class="card" id="ask" aria-labelledby="headline">
    <div class="heart-wrap" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <path class="spark" d="M16 24l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="var(--glow)"/>
        <path class="spark" d="M100 14l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="var(--glow)"/>
        <path class="spark" d="M104 78l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="var(--accent)"/>
        <g class="beat">
          <path d="M60 104C24 78 12 58 12 40c0-14 10-24 23-24 10 0 19 6 25 15 6-9 15-15 25-15 13 0 23 10 23 24 0 18-12 38-48 64z" fill="var(--primary)"/>
          <path d="M30 34c2-7 8-11 14-10" stroke="#fff" stroke-opacity=".6" stroke-width="5" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
    </div>
    <p class="hello" id="hello"></p>
    <h1 id="headline" tabindex="-1"></h1>
    <p class="msg" id="message"></p>
    <p class="msg" id="note" hidden></p>
    <p class="sign" id="sign"></p>
    <div class="arena" id="arena">
      <button class="yes" id="yes" type="button"></button>
      <button class="no" id="no" type="button"></button>
    </div>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <button class="alt" id="later" type="button"></button>
    <div class="tools">
      <button id="langBtn" type="button"></button>
    </div>
  </section>

  <section class="card" id="win" aria-labelledby="winHead" hidden>
    <div class="heart-wrap" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <path class="spark" d="M16 24l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="var(--glow)"/>
        <path class="spark" d="M100 14l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="var(--glow)"/>
        <path class="spark" d="M104 78l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="var(--accent)"/>
        <g class="beat"><path d="M60 104C24 78 12 58 12 40c0-14 10-24 23-24 10 0 19 6 25 15 6-9 15-15 25-15 13 0 23 10 23 24 0 18-12 38-48 64z" fill="var(--primary)"/></g>
      </svg>
    </div>
    <h2 id="winHead" tabindex="-1"></h2>
    <p class="msg" id="winMsg"></p>
    <p class="sign" id="winSign"></p>
    <div class="memory" id="memory" hidden></div>
    <button class="sbtn" id="reveal" type="button" aria-expanded="false" aria-controls="surprise"></button>
    <div class="surprise" id="surprise" hidden>
      <p id="surpriseText" style="margin:0 0 8px"></p>
      <p id="datePrompt" style="margin:0"></p>
      <div id="dates"></div>
      <p id="dateDone" role="status" aria-live="polite" style="margin:8px 0 0"></p>
    </div>
    <div><button class="alt" id="back" type="button">Go back to the question</button></div>
  </section>

  <section class="card" id="nope" aria-labelledby="nopeHead" hidden>
    <div class="heart-wrap" aria-hidden="true" style="font-size:72px;line-height:128px">🌷</div>
    <h2 id="nopeHead" tabindex="-1"></h2>
    <p class="msg" id="nopeMsg"></p>
    <button class="alt" id="nopeBack" type="button">Go back</button>
  </section>
</main>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* ============================================================
   EDIT ME — all personal details live here.
   Change names, wording and colors; no other code needs touching.
   ============================================================ */
const proposalDetails = {
  yourName: "Rahul",
  theirName: "Priya",
  relationshipLabel: "girlfriend",
  headline: "Will you be my girlfriend?",
  personalMessage:
    "Priya, you make every ordinary day feel brighter. I love your laugh, the way we can talk about anything, and how at ease I feel with you. There’s something I’ve been wanting to ask…",
  yesButtonText: "Yes 💖",
  noButtonText: "No 🙈",
  successHeadline: "You just made me the happiest person! 💕",
  successMessage: "I can’t wait to make more lovely memories with you.",
  surpriseMessage: "Our first date is on me! ✨",
  noHeadline: "Thanks for being honest 💗",
  noMessage: "I respect how you feel, and I’m glad we can be open with each other. No pressure at all.",
  /* Optional personal touches — leave "" to hide */
  personalNote: "",       // short note under the message
  insideJoke: "",         // shown after Yes
  favoriteMemory: "",     // shown after Yes
  songTitle: "",
  songLink: "",           // optional https:// link; never autoplays
  theme: "soft",          // "soft" | "celebration" | "minimal"
  language: "en",         // "en" | "hinglish"
  playfulNo: true,        // true = the No button runs away; false keeps Yes and No still and equal
  hinglish: {
    greeting: "Hey {name},",
    headline: "Priya, meri girlfriend banogi?",
    personalMessage: "Priya, tumhare saath har din thoda aur khoobsurat lagta hai. Tumhari hansi, hamari lambi baatein, aur tumhare saath ka sukoon… mujhe tumse kuch poochna hai.",
    yesButtonText: "Haan 💖",
    noButtonText: "Nahi 🙈",
    successHeadline: "Tumne mujhe sabse khush kar diya! 💕",
    successMessage: "Aur bhi pyaari yaadein banane ka intezaar hai.",
    surpriseMessage: "Hamari first date meri taraf se! ✨",
    noHeadline: "Sach batane ke liye thanks 💗",
    noMessage: "Main tumhari feelings ki izzat karta hoon. Koi pressure nahi."
  },
  colors: {
    background: "#fff5f7",
    primary: "#e84a78",
    accent: "#ffc4d6"
  }
};
/* Optional extras (safe to leave as is) */
const extras = {
  greeting: "Hi {name},",
  revealButtonText: "Open your surprise 🎁",
  noHints: [
    "Hehe, nice try! 🙈",
    "The button is feeling shy…",
    "Almost had it! 💨",
    "It really, really wants you to say yes.",
    "Okay, one more chance? 😇"
  ],
  laterButtonText: "I need a little time",
  laterMessage: "Of course. Take all the time you need — there’s no pressure at all. 💗",
  datePrompt: "Pick how our first date should begin:",
  dateIdeas: ["Coffee and a long walk ☕", "Dinner at your favorite place 🍝", "A sunset picnic 🌅"],
  dateChosenMessage: "{idea} — it’s a plan! {you} can’t wait. 💌"
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const d = proposalDetails, root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const isTouchy = matchMedia("(pointer: coarse)").matches;

// Apply content + colors
root.style.setProperty("--cfg-bg", d.colors.background);
root.style.setProperty("--cfg-primary", d.colors.primary);
root.style.setProperty("--cfg-accent", d.colors.accent);
document.title = `${d.theirName}, a question for you 💖`;
$("hello").textContent = extras.greeting.replace("{name}", d.theirName);
$("headline").textContent = d.headline;
$("message").textContent = d.personalMessage;
$("sign").textContent = `— ${d.yourName}`;
$("yes").textContent = d.yesButtonText;
$("no").textContent = d.noButtonText;
$("winHead").textContent = d.successHeadline;
$("winMsg").textContent = d.successMessage;
$("winSign").textContent = `With love, ${d.yourName}`;
$("reveal").textContent = extras.revealButtonText;
$("surpriseText").textContent = d.surpriseMessage;
$("yes").setAttribute("aria-label", `${d.yesButtonText.replace(/[^\p{L}\p{N}\s’'?!.,]/gu, "").trim() || "Yes"} — I will be your ${d.relationshipLabel}`);

// Floating hearts / sparkles (rebuilt when the theme changes)
const sky = $("sky");
function buildSky(glyphs, n) {
  sky.replaceChildren();
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "float";
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = (Math.random() * 96) + "%";
    s.style.fontSize = (14 + Math.random() * 22) + "px";
    s.style.animationDuration = (11 + Math.random() * 12) + "s";
    s.style.animationDelay = (-Math.random() * 20) + "s";
    s.style.setProperty("--dx", (Math.random() * 90 - 45) + "px");
    if (reduce.matches) s.style.top = (Math.random() * 90) + "%";
    sky.appendChild(s);
  }
}

// Playful "No" button: lives inside the arena (part of the card), always moves, never leaves view
const no = $("no"), yes = $("yes"), arena = $("arena"), hint = $("hint");
const M = 12, GAP = 18, playful = d.playfulNo === true;
let dodges = 0, lastMove = 0, cur = null;

function geom() {
  const a = arena.getBoundingClientRect();
  if (!playful || !a.width) return null;
  const w = no.offsetWidth, h = no.offsetHeight, vv = window.visualViewport;
  const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  // Allowed top-left range = visible part of the arena, minus edge margins
  let l = Math.max(0, -a.left) + M, t = Math.max(0, -a.top) + M;
  let r = Math.min(a.width, vw - a.left) - M - w, b = Math.min(a.height, vh - a.top) - M - h;
  if (r < l || b < t) { l = t = M; r = a.width - M - w; b = a.height - M - h; }
  r = Math.max(l, r); b = Math.max(t, b);
  const y = yes.getBoundingClientRect();
  const ya = { l: y.left - a.left - GAP, t: y.top - a.top - GAP, r: y.right - a.left + GAP, b: y.bottom - a.top + GAP };
  const ok = (x, z) => x >= l - 1 && x <= r + 1 && z >= t - 1 && z <= b + 1 &&
    (x + w < ya.l || x > ya.r || z + h < ya.t || z > ya.b);
  return { l, t, r, b, ya, ok };
}
function place(initial) {
  const g = geom();
  if (!g) return;
  const pts = [];
  for (let i = 0; i < 48; i++) pts.push([g.l + Math.random() * (g.r - g.l), g.t + Math.random() * (g.b - g.t)]);
  for (let i = 0; i <= 5; i++) for (let j = 0; j <= 3; j++) pts.push([g.l + (g.r - g.l) * i / 5, g.t + (g.b - g.t) * j / 3]);
  const valid = pts.filter(p => g.ok(p[0], p[1]));
  let pick = null;
  if (initial) {
    const home = [(g.l + g.r) / 2, g.b];
    valid.sort((p, q) => Math.hypot(p[0] - home[0], p[1] - home[1]) - Math.hypot(q[0] - home[0], q[1] - home[1]));
    pick = valid[0];
  } else {
    for (const min of [140, 90, 50, 1]) {
      const far = valid.filter(p => !cur || Math.hypot(p[0] - cur.x, p[1] - cur.y) >= min);
      if (far.length) { pick = far[Math.floor(Math.random() * far.length)]; break; }
    }
  }
  if (!pick) { // tiny arena: take the corner farthest from Yes
    const cx = (g.ya.l + g.ya.r) / 2, cy = (g.ya.t + g.ya.b) / 2;
    pick = [[g.l, g.t], [g.r, g.t], [g.l, g.b], [g.r, g.b]]
      .sort((p, q) => Math.hypot(q[0] - cx, q[1] - cy) - Math.hypot(p[0] - cx, p[1] - cy))[0];
  }
  cur = { x: pick[0], y: pick[1] };
  no.style.left = cur.x + "px"; no.style.top = cur.y + "px";
}
function dodge() {
  if (!playful) return;
  const now = Date.now();
  if (now - lastMove < 220) return; // hover + focus + click fire together; count once
  lastMove = now;
  sfx("boing");
  place(false);
  dodges++;
  hint.textContent = extras.noHints[(dodges - 1) % extras.noHints.length];
  yes.style.setProperty("--yes-scale", Math.min(1 + dodges * 0.04, 1.2));
}
function refit() { // resize / rotation: keep it valid, move only if needed
  const g = geom();
  if (!g) return;
  if (!cur || !g.ok(cur.x, cur.y)) place(!cur);
}
if (playful) {
  no.addEventListener("pointerenter", e => { if (e.pointerType !== "touch") dodge(); });
  no.addEventListener("pointerdown", e => { e.preventDefault(); dodge(); });
  no.addEventListener("focus", dodge);
  no.addEventListener("click", e => { e.preventDefault(); dodge(); });
} else { // default: No is a normal, still button with a kind response
  arena.classList.add("calm");
  $("later").hidden = true;
  no.addEventListener("click", () => {
    $("ask").hidden = true; $("nope").hidden = false;
    scrollTo(0, 0); $("nopeHead").focus({ preventScroll: true });
  });
}
$("nopeBack").addEventListener("click", () => {
  $("nope").hidden = true; $("ask").hidden = false; $("headline").focus({ preventScroll: true });
});
$("later").textContent = extras.laterButtonText;
$("later").addEventListener("click", () => { hint.textContent = extras.laterMessage; });
addEventListener("resize", refit);
addEventListener("orientationchange", () => setTimeout(refit, 250));
if (window.visualViewport) visualViewport.addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(refit).observe(arena);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => place(true));
place(true);

// Success
function celebrate() {
  sfx("win");
  if (reduce.matches) return;
  const box = $("confetti"), bits = ["💖", "💕", "✨", "🌸", "💗", "🎉", "🌷"];
  box.replaceChildren();
  for (let i = 0; i < 46; i++) {
    const p = document.createElement("span");
    p.className = "piece";
    p.textContent = bits[i % bits.length];
    p.style.left = Math.random() * 100 + "%";
    p.style.fontSize = (16 + Math.random() * 22) + "px";
    p.style.setProperty("--t", (2.4 + Math.random() * 2.2) + "s");
    p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    p.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    p.style.animationDelay = Math.random() * 1.2 + "s";
    box.appendChild(p);
  }
  setTimeout(() => box.replaceChildren(), 6500);
}

}

// Background music + sound effects (original, made in the browser).
// Browsers only allow sound after a first tap or key press, so it starts on the first interaction.
let ac = null, master = null, timer = null, nextT = 0, beat = 0, started = false;
const chords = [[261.63, 329.63, 392], [220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66]];
const pattern = [0, 1, 2, 1, 0, 1, 2, 1];
function tone(f, t, dur, vol, type) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function schedule() {
  while (nextT < ac.currentTime + 0.8) {
    const ch = chords[Math.floor(beat / 8) % 4], i = beat % 8;
    tone(ch[pattern[i]] * 2, nextT, 0.9, 0.05);
    if (i === 0) tone(ch[0] / 2, nextT, 3.0, 0.08);
    nextT += 0.42; beat++;
  }
}
async function startMusic() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    }
    await ac.resume();
    if (ac.state !== "running") return;
    if (!started) { started = true; nextT = ac.currentTime + 0.1; timer = setInterval(schedule, 200); }
    schedule();
  } catch (e) {}
}
function sfx(kind) {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime;
  if (kind === "tap") tone(880, t, 0.14, 0.07, "triangle");
  else if (kind === "boing") { tone(520, t, 0.14, 0.08, "triangle"); tone(990, t + 0.07, 0.16, 0.07, "triangle"); }
  else if (kind === "win") [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, t + i * 0.11, 0.7, 0.09, "sine"));
}
// Try right away (works where the browser allows it), then on the first interaction
startMusic();
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, startMusic, { passive: true }));
document.addEventListener("pointerdown", e => { if (e.target.closest("button")) sfx("tap"); });
document.addEventListener("visibilitychange", () => {
  if (!ac || !started) return;
  if (document.hidden) ac.suspend(); else ac.resume();
});
