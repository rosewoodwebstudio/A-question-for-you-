<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ek chhota sa surprise 💖</title>
<meta name="description" content="A little surprise, just for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ivory:#fff8f2;--blush:#f6dce0;--rose:#6e1f35;--gold:#c49a52;--ink:#4a1423;--marigold:#f4a21d;
--page:linear-gradient(165deg,var(--ivory),var(--blush));--foot:var(--rose);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:linear-gradient(165deg,#2c1019,#4a1a2b);--foot:#f6dce0;color-scheme:dark}}
:root[data-theme="dark"]{--page:linear-gradient(165deg,#2c1019,#4a1a2b);--foot:#f6dce0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;background:var(--page);background-attachment:fixed;color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.05rem;line-height:1.6;display:flex;flex-direction:column;align-items:center;padding:12px 14px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;perspective:900px;z-index:0}
.bokeh{position:absolute;inset:-5%;background:radial-gradient(circle at 15% 20%,rgba(244,162,29,.35) 0 6%,transparent 7%),radial-gradient(circle at 85% 30%,rgba(196,154,82,.4) 0 5%,transparent 6%),radial-gradient(circle at 70% 80%,rgba(232,98,132,.3) 0 8%,transparent 9%),radial-gradient(circle at 25% 75%,rgba(244,162,29,.3) 0 5%,transparent 6%);transform:translate3d(calc(var(--mx,0)*-10px),calc(var(--my,0)*-8px),-60px);animation:glow 6s ease-in-out infinite alternate}
.archw{position:absolute;left:50%;bottom:0;width:min(120vw,560px);height:92dvh;margin-left:calc(min(120vw,560px)/-2);transform:translate3d(calc(var(--mx,0)*14px),calc(var(--my,0)*8px),0)}
.arch{width:100%;height:100%;opacity:.8;animation:sway 9s ease-in-out infinite alternate;transform-origin:50% 100%}
.diya{position:absolute;bottom:3%;width:36px;height:16px;border-radius:0 0 40px 40px;background:linear-gradient(var(--gold),#8a5a1c)}
.diya::before{content:"";position:absolute;left:12px;bottom:12px;width:12px;height:20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff6c8,var(--marigold) 60%,transparent 72%);box-shadow:0 0 18px 8px rgba(244,162,29,.55);animation:flick 1.4s ease-in-out infinite alternate}
.petal{position:absolute;top:-8%;animation:fall linear infinite;opacity:.8}
@keyframes sway{from{transform:rotateY(-4deg)}to{transform:rotateY(4deg)}}
@keyframes glow{to{opacity:.65}}
@keyframes flick{to{transform:scale(1.12,.92);opacity:.85}}
@keyframes fall{to{transform:translate3d(var(--dx,30px),112dvh,0) rotate(var(--r,300deg))}}
.wrap{position:relative;z-index:1;width:min(100%,36rem);flex:1;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--foot);font-weight:800;font-size:.95rem}
.bar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--gold) 35%,transparent);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:25%;background:var(--gold);transition:width .5s}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;min-height:min(620px,calc(100dvh - 130px));padding:clamp(22px,5vw,40px) clamp(18px,5vw,36px);border-radius:32px;background:color-mix(in srgb,var(--ivory) 90%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 22px 50px -20px rgba(110,31,53,.5),inset 0 0 0 5px rgba(255,248,242,.7);animation:in .6s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;color:var(--rose);line-height:1.18;margin:.1em 0;font-size:clamp(1.7rem,7vw,2.5rem);text-wrap:balance}
h1:focus,h2:focus{outline:none}
p{margin:.2em 0;text-wrap:pretty;max-width:30rem}
.tag{color:#8a5a1c;font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
button{font:inherit;font-weight:800;border:0;border-radius:999px;min-height:52px;padding:.8em 1.8em;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .2s,left .3s cubic-bezier(.3,1.4,.5,1),top .3s cubic-bezier(.3,1.4,.5,1)}
button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.go,.yes{background:linear-gradient(135deg,#9b2f4f,var(--rose));color:#fff8f2;box-shadow:0 10px 22px -8px var(--rose)}
.go:active,.yes:active{transform:scale(.96)}
.no{background:#fff;color:var(--rose);border:2px solid var(--gold)}
.ghost,.snd{background:transparent;color:var(--foot);min-height:44px;padding:.4em 1em;font-size:.92rem}
.snd{border:2px solid var(--gold)}
.chip{background:#fff;color:var(--rose);border:2px solid var(--gold);min-height:48px;margin:4px;padding:.5em 1.2em}
.chip:hover{background:var(--blush)}
.pic{margin:6px auto;width:min(100%,22rem)}
.pic svg,.pic img{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 12px 26px -14px var(--rose)}
.pic figcaption{font-size:.8rem;color:#7a4a58;margin-top:4px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:26rem}
.gal .pic{width:100%;margin:0}
.arena{position:relative;width:100%;max-width:24rem;height:190px;margin:8px auto 0}
.arena .yes{position:absolute;top:0;left:0;right:0;margin:0 auto;width:max-content;transform:scale(var(--ys,1))}
.no{position:absolute;left:0;top:0;white-space:nowrap}
.arena.calm{height:auto;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.arena.calm .yes,.arena.calm .no{position:static;margin:0;width:auto}
.hint{min-height:1.7em;color:var(--rose);font-weight:600;margin:6px 0}
.foot{text-align:center;color:var(--foot);font-size:.82rem;padding:2px 0 4px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.conf span{position:absolute;top:-8dvh;animation:fall var(--t,3s) ease-in forwards}
[hidden]{display:none!important}
@media (max-width:380px){.card{padding:20px 14px}button{padding:.75em 1.3em}}
@media (max-height:480px) and (orientation:landscape){.card{min-height:0}.arena{height:170px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.conf{display:none}}
</style>

<script>
/* ===== EDIT ME: every personal detail lives here ===== */
const proposalDetails = {
  brandName: "Rosewood Web Studio",
  instagram: "@rosewoodwebstudio",
  yourName: "Rahul",
  theirName: "Priya",
  relationshipLabel: "girlfriend",
  greeting: "Priya, tumhare liye ek chhota sa surprise hai…",
  story: "Tumhari smile aur tumhari baatein mere din ko special bana deti hain.",
  question: "Will you be my girlfriend?",
  yesButtonText: "Haan 💖",
  noButtonText: "Nahi 🙈",
  yesMessage: "Yay! Rahul ki smile ab officially permanent ho gayi! 💕",
  nextStep: "Ab ek cute si date plan karein? Chai, coffee ya pani puri? 😄",
  dateOptions: ["Chai ☕", "Coffee ☕", "Pani puri 😄"],
  dateDoneMessage: "Plan pakka! Rahul ab date ki planning shuru kar raha hai. 💌",
  noTitle: "Sach batane ke liye thank you 🌷",
  noMessage: "Tumhari feelings meri nazar mein bahut important hain. Koi pressure nahi — hamari dosti hamesha special rahegi.",
  continueText: "Continue →",
  noButtonComments: [
    "Arre, itni jaldi bhi kya hai? 😜",
    "Button bhi sharma gaya 🙈",
    "Ek baar Haan pe bhi nazar daalo na 👀",
    "Pakad ke dikhao! 😂",
    "Theek hai, par chai meri taraf se ☕"
  ],
  colors: { ivory: "#fff8f2", blush: "#f6dce0", rosewood: "#6e1f35", gold: "#c49a52" },
  // Your couple photo (path or data URL). If it fails to load, a built-in illustration shows.
  demoImages: { couple: DEMO_COUPLE_IMAGE }
};
/* ====================================================== */
const $ = id => document.getElementById(id), d = proposalDetails, root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
root.style.setProperty("--ivory", d.colors.ivory); root.style.setProperty("--blush", d.colors.blush);
root.style.setProperty("--rose", d.colors.rosewood); root.style.setProperty("--gold", d.colors.gold);
document.title = `${d.brandName} · ${d.yourName} & ${d.theirName} 💖`;

// Text
$("brand").textContent = `${d.yourName} & ${d.theirName} · demo`;
$("h1").textContent = d.greeting; $("p1sub").textContent = "Thoda sa aage badho…";
$("h2").textContent = d.story;
$("h3").textContent = `${d.theirName}, ${d.question.charAt(0).toLowerCase()}${d.question.slice(1)}`;
$("yes").textContent = d.yesButtonText; $("no").textContent = d.noButtonText;
$("yes").setAttribute("aria-label", d.yesButtonText.replace(/[^\p{L}\s]/gu, "").trim() + ", yes");
$("no").setAttribute("aria-label", d.noButtonText.replace(/[^\p{L}\s]/gu, "").trim() + ", no");
["c1", "c2"].forEach(i => $(i).textContent = d.continueText);
$("foot").textContent = `Made with ${d.brandName} · ${d.instagram}`;

// 3D arch: marigold garland drawn in SVG
(function () {
  let s = '<path d="M50 600V250a150 150 0 0 1 300 0V600" fill="none" stroke="#c49a52" stroke-width="5" opacity=".7"/>';
  const dot = (x, y, i) => s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${i % 3 ? 8 : 6}" fill="${i % 3 === 0 ? "#e86284" : i % 3 === 1 ? "#f4a21d" : "#ffc94d"}"/>`;
  let n = 0;
  for (let t = 0; t <= Math.PI; t += 0.12) dot(200 - 150 * Math.cos(t), 250 - 150 * Math.sin(t), n++);
  for (let y = 250; y <= 590; y += 30) { dot(50, y, n++); dot(350, y, n++); }
  $("arch").innerHTML = s;
})();
// Petals
const pe = $("petals");
for (let i = 0; i < (innerWidth < 600 ? 8 : 14); i++) {
  const s = document.createElement("span"); s.className = "petal"; s.textContent = ["🌸", "🏵️", "🌹"][i % 3];
  s.style.left = Math.random() * 96 + "%"; s.style.fontSize = 14 + Math.random() * 14 + "px";
  s.style.animationDuration = 12 + Math.random() * 10 + "s"; s.style.animationDelay = -Math.random() * 18 + "s";
  s.style.setProperty("--dx", Math.random() * 80 - 40 + "px"); s.style.setProperty("--r", Math.random() * 500 - 250 + "deg");
  if (reduce) { s.style.top = Math.random() * 90 + "%"; } pe.appendChild(s);
}
// Parallax (mouse / pointer only; touch uses the gentle sway)
if (!reduce) { let q = 0; addEventListener("pointermove", e => { if (q) return; q = requestAnimationFrame(() => { q = 0;
  root.style.setProperty("--mx", (e.clientX / innerWidth - .5) * 2); root.style.setProperty("--my", (e.clientY / innerHeight - .5) * 2); }); }, { passive: true }); }

// Demo illustrations (inline SVG; replaced by your photo if the path exists)
const frame = (inner, bg) => `<rect width="320" height="210" rx="18" fill="${bg}"/>${inner}`;
const ART = {
  couple: `<svg viewBox="0 0 320 210" role="img" aria-label="Demo illustration: a couple under a marigold arch">${frame('<path d="M50 210V95a110 110 0 0 1 220 0v115" fill="none" stroke="#c49a52" stroke-width="7"/><path d="M50 210V95a110 110 0 0 1 220 0v115" fill="none" stroke="#f4a21d" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="130" cy="108" r="15" fill="#8a5a3c"/><path d="M104 210v-62q0-25 26-25t26 25v62z" fill="#6e1f35"/><circle cx="190" cy="108" r="15" fill="#8a5a3c"/><path d="M164 210v-62q0-25 26-25t26 25v62z" fill="#c0476b"/><path d="M160 66c-10-14-30-4-20 12l20 18 20-18c10-16-10-26-20-12z" fill="#e8315b"/>', "#f6dce0")}</svg>`,
};
function pic(key, alt) {
  const f = document.createElement("figure"); f.className = "pic"; f.style.margin = "6px auto";
  const show = () => { f.innerHTML = ART[key]; add(); };
  const add = () => { const c = document.createElement("figcaption"); c.textContent = "Demo image · apni photo se badlo"; f.appendChild(c); };
  if (d.demoImages[key]) { const i = new Image(); i.loading = "lazy"; i.decoding = "async"; i.alt = alt; i.onerror = show; i.src = d.demoImages[key]; f.appendChild(i); add(); } else show();
  return f;
}
$("couple").appendChild(pic("couple", "Demo couple photo"));

// Story flow
const pages = ["p1", "p2", "p3", "p4"]; let cur = 0;
function go(n, focus = true) {
  cur = n; pages.forEach((id, i) => $(id).hidden = i !== n);
  $("prog").textContent = `${n + 1} of 4`; $("fill").style.width = (n + 1) * 25 + "%";
  scrollTo(0, 0); if (focus) $(["h1", "h2", "h3", "h4"][n]).focus({ preventScroll: true });
  if (n === 2) requestAnimationFrame(() => place(true));
}
document.addEventListener("click", e => { const b = e.target.closest("[data-next]"); if (b) go(+b.dataset.next); });

// Playful "Nahi": dodges a few times inside the card + viewport, then settles and stays selectable
const no = $("no"), yes = $("yes"), arena = $("arena"), hint = $("hint"), M = 12, GAP = 18, MAX = d.noButtonComments.length;
let dodges = 0, settled = reduce, pos = null, last = 0;
if (settled) arena.classList.add("calm");
function geom() {
  const a = arena.getBoundingClientRect(); if (!a.width || settled) return null;
  const w = no.offsetWidth, h = no.offsetHeight, vv = window.visualViewport, vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  let l = Math.max(0, -a.left) + M, t = Math.max(0, -a.top) + M, r = Math.min(a.width, vw - a.left) - M - w, b = Math.min(a.height, vh - a.top) - M - h;
  if (r < l || b < t) { l = t = M; r = a.width - M - w; b = a.height - M - h; }
  r = Math.max(l, r); b = Math.max(t, b);
  const y = yes.getBoundingClientRect(), ya = { l: y.left - a.left - GAP, t: y.top - a.top - GAP, r: y.right - a.left + GAP, b: y.bottom - a.top + GAP };
  return { l, t, r, b, ya, ok: (x, z) => x >= l - 1 && x <= r + 1 && z >= t - 1 && z <= b + 1 && (x + w < ya.l || x > ya.r || z + h < ya.t || z > ya.b) };
}
function place(initial) {
  const g = geom(); if (!g) return;
  const pts = [];
  for (let i = 0; i < 48; i++) pts.push([g.l + Math.random() * (g.r - g.l), g.t + Math.random() * (g.b - g.t)]);
  for (let i = 0; i <= 5; i++) for (let j = 0; j <= 3; j++) pts.push([g.l + (g.r - g.l) * i / 5, g.t + (g.b - g.t) * j / 3]);
  const v = pts.filter(p => g.ok(p[0], p[1])); let p = null;
  if (initial) { const hm = [(g.l + g.r) / 2, g.b]; v.sort((a, b) => Math.hypot(a[0] - hm[0], a[1] - hm[1]) - Math.hypot(b[0] - hm[0], b[1] - hm[1])); p = v[0]; }
  else for (const m of [140, 90, 50, 1]) { const f = v.filter(q => !pos || Math.hypot(q[0] - pos.x, q[1] - pos.y) >= m); if (f.length) { p = f[Math.floor(Math.random() * f.length)]; break; } }
  if (!p) { const cx = (g.ya.l + g.ya.r) / 2, cy = (g.ya.t + g.ya.b) / 2; p = [[g.l, g.t], [g.r, g.t], [g.l, g.b], [g.r, g.b]].sort((a, b) => Math.hypot(b[0] - cx, b[1] - cy) - Math.hypot(a[0] - cx, a[1] - cy))[0]; }
  pos = { x: p[0], y: p[1] }; no.style.left = pos.x + "px"; no.style.top = pos.y + "px";
}
function dodge() {
  if (settled) return false;
  const n = Date.now(); if (n - last < 220) return true; last = n;
  dodges++; hint.textContent = d.noButtonComments[dodges - 1]; sfx("boing");
  if (dodges >= MAX) { settled = true; arena.classList.add("calm"); yes.style.setProperty("--ys", 1.08); }
  else { place(false); yes.style.setProperty("--ys", Math.min(1 + dodges * .03, 1.12)); }

}
no.addEventListener("pointerenter", e => { if (e.pointerType !== "touch") dodge(); });
no.addEventListener("pointerdown", e => { if (!settled) { e.preventDefault(); dodge(); } });
no.addEventListener("focus", () => { if (!settled && pos) dodge(); });
no.addEventListener("click", e => { if (dodge()) { e.preventDefault(); return; } showNo(); });
function refit() { const g = geom(); if (g && (!pos || !g.ok(pos.x, pos.y))) place(!pos); }
addEventListener("resize", refit); addEventListener("orientationchange", () => setTimeout(refit, 250));
if (window.ResizeObserver) new ResizeObserver(refit).observe(arena);

// Responses
function showYes() {
  $("h4").textContent = d.yesMessage; $("p4msg").textContent = d.nextStep; $("dates").hidden = false; $("dateDone").textContent = "";
  mood = 1; go(3); celebrate();
}
function showNo() {
  $("h4").textContent = d.noTitle; $("p4msg").textContent = d.noMessage; $("dates").hidden = true; $("dateDone").textContent = ""; go(3);
}
yes.addEventListener("click", showYes);
d.dateOptions.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = o;
  b.addEventListener("click", () => { $("dateDone").textContent = d.dateDoneMessage; celebrate(); }); $("dates").appendChild(b); });
$("replay").addEventListener("click", () => { mood = 0; dodges = 0; settled = reduce; pos = null; hint.textContent = ""; arena.classList.toggle("calm", reduce); yes.style.setProperty("--ys", 1); go(0); });
function celebrate() {
  sfx("win"); if (reduce) return;
  const c = $("conf"), bits = ["🌸", "🏵️", "💖", "✨", "🎉", "🌹"]; c.replaceChildren();
  for (let i = 0; i < 40; i++) { const s = document.createElement("span"); s.textContent = bits[i % 6]; s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = 16 + Math.random() * 20 + "px"; s.style.setProperty("--t", 2.4 + Math.random() * 2 + "s"); s.style.setProperty("--dx", Math.random() * 140 - 70 + "px");
    s.style.setProperty("--r", Math.random() * 600 - 300 + "deg"); s.style.animationDelay = Math.random() * 1 + "s"; c.appendChild(s); }
  setTimeout(() => c.replaceChildren(), 6000);
}

// Romantic music + sound effects (made in the browser: soft piano arpeggios, warm strings pad, music-box sparkle).
// Sound is ON by default. Browsers only let audio start after the first tap or key press, so it begins then.
let ac = null, master = null, timer = null, nextT = 0, beat = 0, want = true, mood = 0;
const CH = [ // bass + three upper notes: a gentle, repeating love-song progression (C G Am Em F C F G)
  [130.81, 261.63, 329.63, 392], [98, 246.94, 293.66, 392], [110, 261.63, 329.63, 440], [82.41, 246.94, 329.63, 392],
  [87.31, 261.63, 349.23, 440], [130.81, 261.63, 329.63, 392], [87.31, 261.63, 349.23, 440], [98, 246.94, 293.66, 392]
];
const ARP = [0, 1, 2, 1, 0, 1, 2, 1];
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }
function tone(f, t, dur, v, ty, a) { const o = ac.createOscillator(), g = ac.createGain(); o.type = ty || "sine"; o.frequency.value = f; env(g, t, a || .02, v, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05); }
function piano(f, t, dur, v) { tone(f, t, dur, v, "sine", .008); tone(f * 2, t, dur * .5, v * .3, "triangle", .005); }
function sched() {
  while (nextT < ac.currentTime + .8) {
    const st = mood ? .36 : .5, i = beat % 8, ch = CH[Math.floor(beat / 8) % 8];
    if (i === 0) { piano(ch[0], nextT, st * 8, .11); [1, 2, 3].forEach(k => tone(ch[k], nextT, st * 8, .018, "sine", .9)); piano(ch[3] * 2, nextT, st * 3, .035); }
    piano(ch[1 + ARP[i]], nextT, st * 3, .05);
    if (i === 4) piano(ch[2] * 2, nextT, st * 3, .03);
    if (i % 2 === 1 && Math.random() < (mood ? .5 : .3)) tone(ch[1 + Math.floor(Math.random() * 3)] * 4, nextT + st * .5, .7, .018, "sine"); // music-box sparkle
    nextT += st; beat++;
  }
}
function sfx(k) {
  if (!want || !ac || ac.state !== "running") return;
  const t = ac.currentTime, p = (f, du, v, ty, o) => tone(f, t + (o || 0), du, v, ty);
  if (k === "tap") p([1318.5, 1568, 1760, 2093][Math.floor(Math.random() * 4)], .45, .045, "sine"); // soft music-box ping
  else if (k === "boing") { p(880, .25, .05, "sine"); p(1318.5, .35, .05, "sine", .09); } // playful rising bell
  else if (k === "win") { // heartbeat, then a harp-like sweep and shimmer
    [0, .24].forEach(o => { const x = ac.createOscillator(), g = ac.createGain(); x.frequency.setValueAtTime(110, t + o); x.frequency.exponentialRampToValueAtTime(55, t + o + .15);
      env(g, t + o, .01, .3, .22); x.connect(g); g.connect(master); x.start(t + o); x.stop(t + o + .3); });
    [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568, 2093].forEach((f, i) => { piano(f, t + .6 + i * .09, 1.2, .06); });
    [2093, 2637, 3136].forEach((f, i) => p(f, .8, .025, "sine", 1.3 + i * .12));
  }
}
async function ensure() {
  if (!want) return;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .85; master.connect(ac.destination);
      const dl = ac.createDelay(), fb = ac.createGain(), lp = ac.createBiquadFilter(), wet = ac.createGain(); // soft echo for a dreamy room
      dl.delayTime.value = .34; fb.gain.value = .35; lp.type = "lowpass"; lp.frequency.value = 2400; wet.gain.value = .4;
      master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(ac.destination);
    }
    await ac.resume();
    if (ac.state === "running" && !timer) { nextT = ac.currentTime + .1; timer = setInterval(sched, 200); sched(); }
  } catch (e) {}
}
function pauseSound() { clearInterval(timer); timer = null; if (ac) ac.suspend(); }
$("snd").addEventListener("click", () => {
  want = !want; $("snd").setAttribute("aria-pressed", String(want)); $("snd").textContent = want ? "🔔 Sound on" : "🔇 Sound off";
  if (want) ensure(); else pauseSound();
});
ensure(); ["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, ensure, { passive: true }));
document.addEventListener("pointerdown", e => { if (e.target.closest("button") && e.target.id !== "snd") sfx("tap"); });

go(0, false);
